[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-episodic-vector-memmap"
version = "0.1.0"
description = "Zero-copy on-disk memory-mapped vector store with cosine nearest-neighbor retrieval"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-episodic-vector-memmap = "agent_episodic_vector_memmap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_episodic_vector_memmap*"]
